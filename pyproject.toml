[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "gpkit-core"
readme = "README.md"
description = "Package for defining and manipulating geometric programming models."
authors = [
    { name = "Warren Hoburg", email = "whoburg@alum.mit.edu" }
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.16.4",
    "pint>=0.8.1",
    "scipy>=1.7.0",
    "adce>=1.3.2",
    "cvxopt>=1.3.3",
    "matplotlib>=3.3.0",
]

[dependency-groups]
dev = [{include-group = "lint"}, {include-group = "test"}]
lint = [
    "ruff>=0.8.0",
    "import-linter>=2.3",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://www.github.com/beautifulmachines/gpkit-core"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["gpkit"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",      # import sorting, replaces isort
    "PL",     # pylint-parity category (convention/error/refactor/warning), stable rules only
    "ARG",    # unused-argument family
    "BLE",    # blind-except (broad-exception-caught)
    "UP032",  # f-string modernization
    "S102",   # exec-used
]
ignore = [
    "PLR2004",  # magic-value-comparison: noisy, no precedent, revisit later
    "PLW2901",  # redefined-loop-name: idiomatic here, bulk-fix risks bugs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["gpkit/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "solver: marks tests that require a solver",
    "cvxopt: marks tests that require cvxopt",
    "mosek: marks tests that require mosek",
]

[tool.coverage.run]
source = ["gpkit"]
omit = ["gpkit/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]
